name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" cython virtualenv

      - name: Fix NDK and Architecture Settings
        run: |
          sed -i 's/.*android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/.*android.ndk = .*/android.ndk = 25b/' buildozer.spec

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-translator-apk
          path: bin/*.apk
